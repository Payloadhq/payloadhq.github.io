---
deployment:
  tasks:
    - export DEPLOYPATH=/home/paylyibi/public_html/
    - /usr/bin/rsync -a --delete --exclude='.git' --exclude='.cpanel.yml' --exclude='.well-known' /home/paylyibi/repos/payloadhq-site/ $DEPLOYPATH
    - /usr/bin/find $DEPLOYPATH -type f \( -name '*.html' -o -name '*.xml' -o -name '*.txt' -o -name '*.json' -o -name '*.js' -o -name '*.css' \) -exec /bin/sed -i 's|https://payloadhq.github.io|https://payloadhq.dev|g' {} +
    - /usr/bin/find $DEPLOYPATH -type f \( -name '*.html' -o -name '*.xml' -o -name '*.txt' -o -name '*.json' -o -name '*.js' -o -name '*.css' \) -exec /bin/sed -i 's|//payloadhq.github.io|//payloadhq.dev|g' {} +
